<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122922">
  <title>Boco's World: Skybound</title>
  <meta name="apple-mobile-web-app-title" content="Boco Skybound">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="console" aria-label="Boco's World: Skybound">
    <section class="screen" aria-label="Game viewport">
      <div id="game-mount"></div>
      <div id="hud" class="hud" hidden aria-label="Game status">
        <div class="hud-row"><span id="hud-area"></span><span id="hud-health" aria-label="Health"></span><span id="hud-emblems"></span><button id="sound-button" class="icon-button" type="button" aria-label="Mute sound" title="Mute sound" aria-pressed="false"></button><button id="pause-button" class="icon-button" type="button" aria-label="Pause" title="Pause"></button></div>
        <div id="hud-boss" class="boss-bar" hidden><span id="hud-boss-name"></span><meter id="hud-boss-meter" min="0" max="1" value="1" aria-label="Boss health"></meter></div>
        <span id="hud-glide" class="glide-state" hidden>GLIDE</span>
      </div>
      <div id="chapter-card" class="chapter-card" hidden aria-live="polite">
        <span id="chapter-area" class="chapter-area"></span>
        <span id="chapter-number" class="chapter-number"></span>
        <strong id="chapter-name" class="chapter-name"></strong>
        <span id="chapter-style" class="chapter-style"></span>
        <p id="chapter-tagline" class="chapter-tagline"></p>
      </div>
      <div id="overlay" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </section>
    <div id="touch-controls" class="touch-controls" aria-label="Touch controls">
      <div class="control-left">
        <div id="dpad" class="dpad" role="group" aria-label="Move">
          <span class="dpad-arrow north" aria-hidden="true">▲</span><span class="dpad-arrow west" aria-hidden="true">◀</span><span class="dpad-arrow east" aria-hidden="true">▶</span><span class="dpad-arrow south" aria-hidden="true">▼</span><span class="dpad-center" aria-hidden="true"></span>
        </div>
      </div>
      <div class="control-right">
        <button class="touch-action attack" data-action="attack" aria-label="Attack">A<span>Attack</span></button>
        <button class="touch-action jump" data-action="jump" aria-label="Jump">B<span>Jump</span></button>
        <button class="touch-action glide" data-action="glide" aria-label="Glide">G<span>Glide</span></button>
      </div>
    </div>
  </main>
  <script src="./vendor/phaser.min.js"></script>
  <script type="module" src="./game.js"></script>
</body>
</html>
